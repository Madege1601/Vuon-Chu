<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vườn Chữ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=EB+Garamond:wght@400;500&family=Literata:opsz,wght@7..72,400;7..72,600&family=Montserrat:wght@400;600&family=Open+Sans:wght@400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ===== MÀU SẮC VÀ PHÔNG CHỮ: sửa ở đây để đổi giao diện ===== */
:root{
  --bg:#F4F7F4; --surface:#FFFFFF; --ink:#1B2924; --muted:#5A6B65; --line:#D9E3DD;
  --accent:#1D6B58; --accent-ink:#FFFFFF; --soft:#E5EFEA; --warn:#B4531E;
  --topbar:#F4F7F4; --shadow:0 8px 28px rgba(20,40,32,.12);
  --f-ui:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-display:'Playfair Display',Georgia,'Times New Roman',serif;
  --f-read:'Literata',Georgia,serif;
  --rbg:#FFFFFF; --rfg:#222B27;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1613; --surface:#18221E; --ink:#E6EFEA; --muted:#93A59D; --line:#2A3832;
  --accent:#58C4A4; --accent-ink:#06150F; --soft:#1E2D27; --warn:#F0966A;
  --topbar:#0F1613; --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;left:-9999px}

.topbar{position:sticky;top:0;z-index:50;background:var(--topbar);border-bottom:1px solid var(--line);
  margin-inline:-16px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.2px;color:var(--ink);background:none;border:0;padding:0;display:flex;align-items:center;gap:8px}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:15px}
.grow{flex:1}
.iconbtn{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:10px;height:38px;min-width:38px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.iconbtn:hover{border-color:var(--accent)}
.badge{position:absolute;top:-6px;right:-6px;background:var(--warn);color:#fff;font-size:11px;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.menu-toggle{display:none}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 16px;font-weight:600;display:inline-block}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:5px 12px;font-size:13px}

.app{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;padding-block:22px 48px}
.rail{position:sticky;top:74px;align-self:start;display:flex;flex-direction:column;gap:2px}
.rail button{text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500;display:flex;gap:10px;align-items:center}
.rail button:hover{background:var(--soft);color:var(--ink)}
.rail button[aria-current="page"]{background:var(--soft);color:var(--accent);font-weight:600}
.rail .grp{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:14px 12px 4px}
.scrim{display:none}
main{min-width:0}

.hero{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:28px;display:grid;gap:10px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(26px,4vw,40px)}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.hero .glyph{position:absolute;right:-10px;top:-30px;font-family:var(--f-display);font-size:190px;color:var(--soft);line-height:1;pointer-events:none;user-select:none}
.hero>*:not(.glyph){position:relative}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;margin:30px 0 12px;gap:12px}
.sec-title h2{font-size:22px}
.sec-title button{border:0;background:none;color:var(--accent);font-weight:600;padding:0}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.card{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;overflow:hidden;padding:0;display:flex;flex-direction:column;min-width:0}
.card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.cover{aspect-ratio:3/4;max-width:100%;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:54px;position:relative}
.cover small{position:absolute;left:10px;bottom:8px;font-family:var(--f-ui);font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.card .meta{padding:10px 12px 12px;display:grid;gap:2px}
.card .meta b{font-weight:600;line-height:1.3}
.card .meta span{color:var(--muted);font-size:13px}
.chip{display:inline-block;font-size:12px;border:1px solid var(--line);background:var(--soft);color:var(--muted);border-radius:99px;padding:1px 10px}

.panel{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:18px}
.detail{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px}
.detail .cover{border-radius:12px;font-size:70px}
.chapters{display:grid;gap:6px;margin-top:14px}
.chapters button{display:flex;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px}
.chapters button:hover{border-color:var(--accent)}

.mrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.mrow .mt{display:grid;min-width:0}
.mrow .mt b{overflow-wrap:anywhere}
.btn.danger{color:var(--warn);border-color:var(--warn)}

.rank{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.rank li{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px}
.rank .no{font-family:var(--f-display);font-size:22px;color:var(--muted);text-align:center}
.rank li:nth-child(-n+3) .no{color:var(--accent)}
.rank .bar{height:6px;background:var(--soft);border-radius:9px;margin-top:6px;overflow:hidden}
.rank .bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.rank .num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.chat{display:grid;gap:10px;max-height:52vh;overflow:auto;padding:4px 2px 4px 0}
.msg{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:14px}
.msg .b{background:var(--soft);border-radius:12px;padding:8px 12px;overflow-wrap:anywhere}
.msg .b small{color:var(--muted);display:block;font-size:12px}
.chatform{display:flex;gap:8px;margin-top:12px}
input[type=text],input[type=password],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.6;font-family:inherit}
details.faq{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;margin-bottom:8px}
details.faq summary{cursor:pointer;font-weight:600}
details.faq p{color:var(--muted);margin:8px 0 0}

.reader-wrap{display:grid;gap:14px}
.reader-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.reader{background:var(--rbg);color:var(--rfg);border-radius:16px;border:1px solid var(--line);padding:clamp(20px,5vw,56px);font-family:var(--f-read);font-size:21px;line-height:2}
.reader h2{font-size:1.15em;margin-bottom:.6em;font-family:var(--f-display);max-width:62ch;margin-inline:auto}
.reader p{margin:0 0 1em;max-width:62ch;margin-inline:auto;padding:0 6px;border-radius:6px}
.reader p.now{background:rgba(29,107,88,.16)}
.chnav{display:flex;justify-content:space-between;gap:10px}

.modal{position:fixed;inset:0;z-index:100;background:rgba(8,16,12,.55);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none!important}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);width:min(460px,100%);max-height:88vh;overflow:auto;padding:22px}
.sheet h2{font-size:22px;margin-bottom:4px}
.sheet .x{float:right;border:0;background:none;font-size:22px;line-height:1;color:var(--muted)}
.field{display:grid;gap:4px;margin:10px 0}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.note{font-size:12.5px;color:var(--muted)}
.pop{position:absolute;right:0;top:46px;width:min(320px,86vw);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px;z-index:70}
.pop[hidden]{display:none!important}
.pop button.item{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px}
.pop button.item:hover{background:var(--soft)}
.nitem{padding:8px 10px;border-radius:8px;font-size:14px}
.nitem.un{background:var(--soft)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}
.sw{display:flex;gap:8px}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}
.sw button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--surface) inset}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:200;font-size:14px;max-width:90vw;text-align:center}
.toast[hidden]{display:none!important}
footer{border-top:1px solid var(--line);margin-top:40px;padding-top:18px;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between}
footer a,footer button{color:var(--accent);background:none;border:0;padding:0;text-decoration:underline}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .menu-toggle{display:inline-flex}
  .rail{position:fixed;z-index:90;top:0;bottom:0;left:0;width:min(280px,82vw);background:var(--surface);border-right:1px solid var(--line);
    padding:calc(env(safe-area-inset-top,0px) + 16px) 12px 16px max(12px,env(safe-area-inset-left,0px));transform:translateX(-105%);transition:transform .2s;overflow:auto;align-self:auto}
  .rail.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;z-index:80;background:rgba(8,16,12,.45)}
  .detail{grid-template-columns:minmax(0,1fr)}
  .detail .cover{max-width:180px}
  .reader{font-size:19px}
}
@media (prefers-reduced-motion:reduce){.rail{transition:none}}
</style>
</head>
<body>

<header class="topbar">
  <button class="iconbtn menu-toggle" id="menuBtn" aria-label="Mở menu">☰</button>
  <button class="brand" data-go="home"><i>V</i>Vườn Chữ</button>
  <span class="grow"></span>
  <button class="iconbtn" id="searchBtn" aria-label="Tìm kiếm">⌕ <span class="sr">Tìm kiếm</span></button>
  <span style="position:relative">
    <button class="iconbtn" id="bellBtn" aria-label="Thông báo">🔔<span class="badge" id="bellBadge">1</span></button>
    <div class="pop" id="bellPop" hidden></div>
  </span>
  <span style="position:relative" id="userSlot"></span>
</header>

<div class="scrim" id="scrim"></div>
<div class="app">
  <nav class="rail" id="rail" aria-label="Điều hướng chính"></nav>
  <main id="view"></main>
</div>

<div class="modal" id="authModal" hidden><div class="sheet" role="dialog" aria-modal="true" aria-label="Tài khoản"></div></div>
<div class="modal" id="searchModal" hidden><div class="sheet" role="dialog" aria-modal="true" aria-label="Tìm kiếm"></div></div>
<div class="modal" id="settingsModal" hidden><div class="sheet" role="dialog" aria-modal="true" aria-label="Cài đặt đọc truyện"></div></div>
<div class="modal" id="creditModal" hidden><div class="sheet" role="dialog" aria-modal="true" aria-label="Ghi công"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
/* ===== TIỆN ÍCH ===== */
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function store(k,v){try{if(v===undefined){var r=localStorage.getItem(k);return r?JSON.parse(r):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function unstore(k){try{localStorage.removeItem(k)}catch(e){}}
var toastT;function toast(t){var el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){el.hidden=true},2600)}
function clone(x){return JSON.parse(JSON.stringify(x))}
function nfc(s){return String(s).normalize('NFC')}
function fmtDate(t){return t?new Date(t).toLocaleDateString('vi-VN'):''}

/* ===== DỮ LIỆU TRUYỆN =====
   Truyện bạn đăng hoặc sửa trên web được lưu trong trình duyệt của bạn (khóa vc_stories).
   Muốn mọi người cùng thấy: vào "Quản lý truyện", bấm "Tải truyen.json",
   rồi đưa file truyen.json lên GitHub, cùng thư mục với index.html. */
function clean(a){
  return (Array.isArray(a)?a:[]).filter(function(s){return s&&s.title&&Array.isArray(s.ch)}).map(function(s,i){
    return {id:String(s.id||('s'+Date.now().toString(36)+i)),sec:s.sec==='ngan'?'ngan':'dai',title:String(s.title),author:String(s.author||''),
      hue:typeof s.hue==='number'?s.hue:200,tags:Array.isArray(s.tags)?s.tags.map(String):[],intro:String(s.intro||''),created:s.created||0,
      ch:s.ch.filter(function(c){return c&&Array.isArray(c.p)}).map(function(c){return {t:String(c.t||''),p:c.p.map(String)}})};
  });
}
function hasLocal(){return Array.isArray(store('vc_stories'))}
var BASE=[];
var STORIES=hasLocal()?clean(store('vc_stories')):[];
function saveStories(){store('vc_stories',STORIES)}
function byId(id){return STORIES.filter(function(s){return s.id===id})[0]}

/* Tách nội dung thành chương: dòng bắt đầu bằng "Chương" hoặc "Chọn truyện" mở chương mới; mỗi dòng còn lại là một đoạn văn */
var HEAD=/^(chương|trọn truyện)/i;
function parseChapters(raw,sec){
  var chs=[],cur=null;
  nfc(raw).split('\n').forEach(function(l){
    l=l.trim();if(!l)return;
    if(HEAD.test(l)){if(cur&&cur.p.length)chs.push(cur);cur={t:l,p:[]}}
    else{if(!cur)cur={t:sec==='ngan'?'Trọn truyện':'Chương 1',p:[]};cur.p.push(l)}
  });
  if(cur&&cur.p.length)chs.push(cur);
  return chs;
}
function toRaw(s){return s.ch.map(function(c,i){var t=HEAD.test(c.t)?c.t:'Chương '+(i+1)+': '+c.t;return t+'\n'+c.p.join('\n')}).join('\n\n')}

/* ===== NỘI DUNG TRANG TĨNH ===== */
var NAV=[
 {id:'home',label:'Trang chủ',ic:'⌂'},
 {id:'chat',label:'Sảnh Trò Chuyện',ic:'✉'},
 {g:'Thư viện'},
 {id:'dai',label:'Vườn Truyện Dài',ic:'❦'},
 {id:'ngan',label:'Vườn Truyện Ngắn',ic:'✎'},
 {id:'theory',label:'Cơ Sở Lý Thuyết',ic:'☰'},
 {g:'Cộng đồng'},
 {id:'rank',label:'Bảng Xếp Hạng',ic:'★'},
 {id:'staff',label:'Công Tác Thành Viên',ic:'✦'},
 {g:'Quản trị'},
 {id:'manage',label:'Quản lý truyện',ic:'⚙'}
];
var NOTI=[{id:1,t:'Chào mừng bạn đến với Vườn Chữ. Vào “Quản lý truyện” để đăng truyện đầu tiên.',un:true}];
var THEORY=[
 ['Cách đăng truyện?','Vào “Quản lý truyện”, bấm “Truyện mới”, điền thông tin rồi dán nội dung. Mỗi dòng là một đoạn văn. Gõ “Chương 1: Tên chương” ở đầu dòng để bắt đầu một chương mới.'],
 ['Truyện được lưu ở đâu?','Truyện bạn đăng hoặc sửa được lưu trong trình duyệt của bạn. Muốn mọi người cùng đọc, vào “Quản lý truyện”, tải file truyen.json rồi đưa lên cùng thư mục với index.html trên GitHub.'],
 ['Tôi có thể chỉnh giao diện đọc không?','Có. Trong trang đọc, nhấn “Cài đặt đọc” để đổi màu nền, cỡ chữ, phông chữ và giãn dòng. Thiết lập được lưu trên trình duyệt của bạn.'],
 ['“Đọc to” và “Cuộn tự động” hoạt động thế nào?','Đọc to dùng giọng đọc có sẵn của thiết bị, đọc từng đoạn và tô sáng đoạn đang đọc. Cuộn tự động kéo trang xuống đều với tốc độ bạn chọn, và có thể tự chuyển chương khi đến cuối.'],
 ['Nội quy cộng đồng','Tôn trọng tác giả và người dịch, ghi rõ nguồn khi đăng lại, không đăng nội dung vi phạm pháp luật, không công kích cá nhân.']
];
var CREDITS=[['Người sáng lập','Tên thành viên'],['Thiết kế & lập trình','Tên thành viên'],['Hội đồng biên tập','Tên thành viên · Tên thành viên']];

/* ===== TRẠNG THÁI ===== */
var S={route:'home',arg:null,ch:0,user:store('vc_user'),rank:'new',delArm:null,
  rs:Object.assign({bg:'paper',size:21,font:'Literata',lh:2,speed:3,rate:1,autonext:true},store('vc_reader')||{}),
  noti:NOTI.slice(),muted:false,
  chat: store('vc_chat') || [{u:'Quản trị viên',m:'Chào mừng mọi người đến với Sảnh Trò Chuyện!',c:162}]};
var BGS={paper:['#FFFFFF','#222B27'],sepia:['#F3EAD3','#3B3224'],grey:['#D9DDDA','#1E2421'],night:['#10151A','#C9D3D8']};

/* ===== KHUNG TRANG ===== */
function renderRail(){
  $('#rail').innerHTML=NAV.map(function(n){
    if(n.g)return '<div class="grp">'+n.g+'</div>';
    var cur=S.route===n.id||((S.route==='story'||S.route==='read'||S.route==='edit')&&S.arg&&byId(S.arg)&&byId(S.arg).sec===n.id);
    return '<button data-go="'+n.id+'"'+(cur?' aria-current="page"':'')+'><span aria-hidden="true">'+n.ic+'</span>'+n.label+'</button>';
  }).join('');
}
function renderUser(){
  var s=$('#userSlot');
  if(!S.user){s.innerHTML='<button class="btn sm" id="loginBtn">Đăng nhập</button>';return}

function stopMedia(){stopScroll();stopTTS()}
function go(route,arg,ch){
  stopMedia();
  if((route==='story'||route==='read')&&!byId(arg)){route='home';arg=null}
  if(route==='edit'&&arg!=='new'&&!byId(arg)){route='manage';arg=null}
  if(route==='read'){
    var s0=byId(arg);
    if(!s0.ch.length){toast('Truyện này chưa có chương nào');route='story';ch=0}
    else{ch=Math.min(Math.max(ch||0,0),s0.ch.length-1);var P=store('vc_prog')||{};P[arg]=ch;store('vc_prog',P)}
  }
  if(route!=='manage')S.delArm=null;
  S.route=route;S.arg=arg||null;S.ch=ch||0;
  $('#view').innerHTML=V[route]()+footer();
  renderRail();closeDrawer();window.scrollTo(0,0);
  if(route==='read')applyReader();
}

function applyReader(){
  var r=$('#reader');if(!r)return;var c=BGS[S.rs.bg]||BGS.paper;
  r.style.background=c[0];r.style.color=c[1];
  r.style.fontSize=S.rs.size+'px';r.style.lineHeight=S.rs.lh;r.style.fontFamily="'"+S.rs.font+"',Georgia,serif";

var scrollT=null;
function stopScroll(){if(scrollT){clearInterval(scrollT);scrollT=null}var b=$('#scrollBtn');if(b)b.textContent='▶ Cuộn tự động'}
function startScroll(){
  stopScroll();var b=$('#scrollBtn');if(b)b.textContent='❚❚ Dừng cuộn';
  scrollT=setInterval(function(){
    window.scrollBy(0,S.rs.speed*0.6+0.4);
    var atEnd=(window.innerHeight+window.scrollY)>=document.documentElement.scrollHeight-4;
    if(atEnd){var s=byId(S.arg);stopScroll();if(S.rs.autonext&&S.ch<s.ch.length-1){toast('Chuyển sang chương sau…');setTimeout(function(){go('read',S.arg,S.ch+1);startScroll()},900)}}
  },30);
}
var ttsOn=false,ttsIdx=0;
function stopTTS(){ttsOn=false;try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}$$('#reader p.now').forEach(function(p){p.classList.remove('now')});var b=$('#ttsBtn');if(b)b.textContent='▶ Đọc to'}
function startTTS(from){
  if(!('speechSynthesis' in window)){toast('Thiết bị này chưa hỗ trợ đọc to');return}
  stopTTS();var ps=$$('#reader p');if(!ps.length)return;
  ttsOn=true;ttsIdx=from||0;$('#ttsBtn').textContent='❚❚ Dừng đọc';
  (function next(){
    if(!ttsOn)return;
    if(ttsIdx>=ps.length){var s=byId(S.arg);stopTTS();if(S.rs.autonext&&S.ch<s.ch.length-1){go('read',S.arg,S.ch+1);setTimeout(function(){startTTS(0)},400)}return}
    $$('#reader p.now').forEach(function(p){p.classList.remove('now')});
    var p=ps[ttsIdx];p.classList.add('now');p.scrollIntoView({block:'center',behavior:'smooth'});
    var u=new SpeechSynthesisUtterance(p.textContent);u.lang='vi-VN';u.rate=S.rs.rate;
    u.onend=function(){ttsIdx++;next()};u.onerror=function(){stopTTS()};
    try{speechSynthesis.speak(u)}catch(e){stopTTS()}
  })();
}

   '<div class="setrow"><label for="spd">Tốc độ cuộn tự động</label><input id="spd" type="range" min="1" max="10" value="'+r.speed+'" style="width:140px"></div>'+

<script>
// Kích hoạt chế độ Offline (Service Worker)

  /* ===== ADD-ON: UP FILE TRUYỆN MỌI ĐỊNH DẠNG (độc lập, dán vào cuối index.html, ngay trước </body>) =====
   Đọc: .txt .md .html .docx .odt .epub .rtf .json .pdf (pdf cần mạng). Lưu vào khóa vc_stories của trình duyệt. */
(function(){
'use strict';
if(window.__vcUpload)return;window.__vcUpload=1;
function nfc(s){return String(s).normalize('NFC')}
function uid(){return 's'+Date.now().toString(36)+Math.floor(Math.random()*46656).toString(36)}
var H1=/^(chương|chuong|chapter|hồi|quyển|tập|phần)\s+([0-9]+|[ivxlcdm]+)(?![\p{L}\p{N}])/iu;
var H2=/^(trọn truyện|lời mở đầu|lời tựa|ngoại truyện|phiên ngoại|prologue|epilogue)/i;
var H3=/^chương\s*[:.\-–—]/i;
function isHeading(l){return l.length<=140&&(H1.test(l)||H2.test(l)||H3.test(l))}
function clean(a){
  return (Array.isArray(a)?a:[]).filter(function(s){return s&&s.title&&Array.isArray(s.ch)}).map(function(s,i){
    return {id:String(s.id||(uid()+i)),sec:s.sec==='ngan'?'ngan':'dai',title:String(s.title),author:String(s.author||''),
      hue:typeof s.hue==='number'?s.hue:200,tags:Array.isArray(s.tags)?s.tags.map(String):[],intro:String(s.intro||''),created:s.created||0,
      ch:s.ch.filter(function(c){return c&&Array.isArray(c.p)}).map(function(c){return {t:String(c.t||''),p:c.p.map(String)}})};
  });
}

/* ===== ĐỌC FILE TRUYỆN TẢI LÊN ===== */
function decodeText(buf){
  var u=new Uint8Array(buf);
  if(u[0]===0xEF&&u[1]===0xBB&&u[2]===0xBF)return new TextDecoder('utf-8').decode(u.subarray(3));
  if(u[0]===0xFF&&u[1]===0xFE)return new TextDecoder('utf-16le').decode(u.subarray(2));
  if(u[0]===0xFE&&u[1]===0xFF)return new TextDecoder('utf-16be').decode(u.subarray(2));
  try{return new TextDecoder('utf-8',{fatal:true}).decode(u)}catch(e){}
  try{return new TextDecoder('windows-1258').decode(u)}catch(e){return new TextDecoder('windows-1252').decode(u)}
}
function parseXML(s){var d=new DOMParser().parseFromString(s,'application/xml');if(d.getElementsByTagName('parsererror').length)throw new Error('Không đọc được nội dung bên trong file');return d}
function nsAll(el,name){return Array.prototype.slice.call(el.getElementsByTagNameNS('*',name))}
function normPath(p){var o=[];p.split('/').forEach(function(x){if(x==='..')o.pop();else if(x&&x!=='.')o.push(x)});return o.join('/')}

/* đọc zip (docx, epub, odt) */
function zipRead(buf){
  var u=new Uint8Array(buf),dv=new DataView(buf),n=u.length,eo=-1,dec=new TextDecoder('utf-8');
  for(var i=n-22;i>=Math.max(0,n-65557);i--){if(dv.getUint32(i,true)===0x06054b50){eo=i;break}}
  if(eo<0)throw new Error('File nén bị lỗi hoặc không đúng định dạng');
  var cnt=dv.getUint16(eo+10,true),p=dv.getUint32(eo+16,true),ents={};
  for(var k=0;k<cnt;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    var nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true);
    ents[dec.decode(u.subarray(p+46,p+46+nl))]={method:dv.getUint16(p+10,true),cs:dv.getUint32(p+20,true),lo:dv.getUint32(p+42,true)};
    p+=46+nl+el+cl;
  }
  function get(name){
    var e=ents[name];if(!e)return Promise.resolve(null);
    if(e.cs===0xFFFFFFFF)return Promise.reject(new Error('File zip64 quá lớn chưa hỗ trợ'));
    var nl=dv.getUint16(e.lo+26,true),el=dv.getUint16(e.lo+28,true),st=e.lo+30+nl+el,data=u.subarray(st,st+e.cs);
    if(e.method===0)return Promise.resolve(data);
    if(e.method!==8)return Promise.reject(new Error('Kiểu nén của file chưa hỗ trợ'));
    if(typeof DecompressionStream==='undefined')return Promise.reject(new Error('Trình duyệt quá cũ để giải nén file, hãy cập nhật trình duyệt'));
    return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer().then(function(b){return new Uint8Array(b)});
  }
  return {names:Object.keys(ents),get:get,text:function(name){return get(name).then(function(d){return d?dec.decode(d):null})}};
}

/* văn bản thuần và markdown */
function mdClean(s){return s.replace(/(\*\*|__)(.+?)\1/g,'$2').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1$2').replace(/`([^`]+)`/g,'$1').replace(/!?\[([^\]]*)\]\([^)]*\)/g,'$1').trim()}
function textBlocks(text,md){
  text=nfc(text).replace(/\r\n?/g,'\n');
  var paras=text.split(/\n\s*\n/),multi=0;
  paras.forEach(function(b){if(b.trim().split('\n').length>1)multi++});
  var join=paras.length>3&&multi/paras.length>0.5,blocks=[];
  paras.forEach(function(b){
    var buf=[];
    function flush(){if(buf.length){if(join)blocks.push({h:false,t:buf.join(' ')});else buf.forEach(function(x){blocks.push({h:false,t:x})});buf=[]}}
    b.split('\n').forEach(function(l){
      l=l.trim();if(!l)return;
      if(md){
        var m=l.match(/^#{1,6}\s+(.*)$/);
        if(m){flush();blocks.push({h:true,t:mdClean(m[1])});return}
        if(/^([-*_]\s*){3,}$/.test(l))return;
        l=mdClean(l.replace(/^>\s?/,''));if(!l)return;
      }
      if(isHeading(l)){flush();blocks.push({h:true,t:l});return}
      buf.push(l);
    });
    flush();
  });
  return blocks;
}

/* html */
function htmlBlocks(doc){
  Array.prototype.forEach.call(doc.querySelectorAll('script,style,noscript,nav'),function(n){n.remove()});
  var BLK='p,div,h1,h2,h3,h4,h5,h6,li,ul,ol,blockquote,table,pre',out=[];
  var els=(doc.body||doc).querySelectorAll('h1,h2,h3,h4,h5,h6,p,li,blockquote,pre,div');
  Array.prototype.forEach.call(els,function(el){
    var tag=el.tagName.toLowerCase();
    if((tag==='li'||tag==='blockquote'||tag==='div')&&el.querySelector(BLK))return;
    if(tag==='pre'){nfc(el.textContent).split('\n').forEach(function(l){l=l.trim();if(l)out.push({h:isHeading(l),t:l})});return}
    var t=nfc(el.textContent).replace(/\s+/g,' ').trim();if(!t)return;
    out.push({h:/^h[1-3]$/.test(tag)||isHeading(t),t:t});
  });
  if(!out.length&&doc.body)return textBlocks(doc.body.textContent||'');
  return out;
}

/* docx */
function parseDocx(z){
  return z.text('word/document.xml').then(function(x){
    if(!x)throw new Error('File .docx không có nội dung');
    var d=parseXML(x),blocks=[];
    nsAll(d,'p').forEach(function(p){
      var heading=false,ppr=nsAll(p,'pPr')[0];
      if(ppr){
        var st=nsAll(ppr,'pStyle')[0],sv=st?(st.getAttribute('w:val')||''):'';
        if(sv&&/^(heading\s*\d|title|subtitle|tiêu\s*đề)/i.test(sv))heading=true;
        var ol=nsAll(ppr,'outlineLvl')[0];if(ol&&parseInt(ol.getAttribute('w:val'),10)<3)heading=true;
      }
      var t='';
      Array.prototype.forEach.call(p.getElementsByTagName('*'),function(n){var ln=n.localName;if(ln==='t')t+=n.textContent;else if(ln==='tab'||ln==='br')t+=' '});
      t=nfc(t).replace(/\s+/g,' ').trim();if(!t)return;
      blocks.push({h:(heading&&t.length<=160)||isHeading(t),t:t});
    });
    return z.text('docProps/core.xml').then(function(c){
      var title='',author='';
      if(c){try{var cd=parseXML(c),a=nsAll(cd,'title')[0],b=nsAll(cd,'creator')[0];title=a?a.textContent.trim():'';author=b?b.textContent.trim():''}catch(e){}}
      return {title:title,author:author,blocks:blocks};
    }).catch(function(){return {title:'',author:'',blocks:blocks}});
  });
}

/* odt */
function parseOdt(z){
  return z.text('content.xml').then(function(x){
    var d=parseXML(x),blocks=[];
    Array.prototype.forEach.call(d.getElementsByTagNameNS('*','*'),function(n){
      var ln=n.localName;if(ln!=='h'&&ln!=='p')return;
      var t=nfc(n.textContent).replace(/\s+/g,' ').trim();if(!t)return;
      blocks.push({h:ln==='h'||isHeading(t),t:t});
    });
    return {title:'',author:'',blocks:blocks};
  });
}

/* epub */
function parseEpub(z){
  return z.text('META-INF/container.xml').then(function(c){
    if(!c)throw new Error('File .epub không hợp lệ');
    var rf=nsAll(parseXML(c),'rootfile')[0],opfPath=rf&&rf.getAttribute('full-path');
    if(!opfPath)throw new Error('File .epub thiếu mục lục');
    return z.text(opfPath).then(function(o){
      var opf=parseXML(o),base=opfPath.indexOf('/')>-1?opfPath.slice(0,opfPath.lastIndexOf('/')+1):'',man={};
      nsAll(opf,'item').forEach(function(it){man[it.getAttribute('id')]={href:it.getAttribute('href')||'',props:it.getAttribute('properties')||'',type:it.getAttribute('media-type')||''}});
      var spine=nsAll(opf,'itemref').map(function(r){return r.getAttribute('idref')}).filter(function(id){return man[id]&&/html/i.test(man[id].type)&&man[id].props.indexOf('nav')<0});
      var tt=nsAll(opf,'title')[0],au=nsAll(opf,'creator')[0],chs=[];
      return spine.reduce(function(pr,id){return pr.then(function(){
        var path=normPath(base+decodeURIComponent(man[id].href.split('#')[0]));
        return z.text(path).then(function(h){
          if(!h)return;
          var bl=htmlBlocks(new DOMParser().parseFromString(h,'text/html')),title=null,p=[];
          bl.forEach(function(b){if(b.h&&title===null&&!p.length)title=b.t;else p.push(b.t)});
          if(p.length)chs.push({t:title,p:p});
        });
      })},Promise.resolve()).then(function(){
        return {title:tt?tt.textContent.trim():'',author:au?au.textContent.trim():'',chapters:chs.map(function(c,i){return {t:c.t||('Chương '+(i+1)),p:c.p}})};
      });
    });
  });
}

/* pdf (dùng thư viện pdf.js, tải khi cần, cần có mạng) */
var PDFJS='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/';
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=function(){rej(new Error('Không tải được thư viện đọc PDF. Cần có mạng khi nhập file PDF.'))};document.head.appendChild(s)})}
function pdfBlocks(lines){
  var out=[],buf='';
  function flush(){if(buf.trim())out.push({h:false,t:buf.trim()});buf=''}
  lines.forEach(function(l){
    l=nfc(l).replace(/\s+/g,' ').trim();
    if(!l||/^\d{1,4}$/.test(l))return;
    if(isHeading(l)){flush();out.push({h:true,t:l});return}
    buf+=(buf?' ':'')+l;
    if(/[.!?…:;”"')\]]$/.test(l)||buf.length>1500)flush();
  });
  flush();return out;
}
function parsePdf(buf){
  var load=window.pdfjsLib?Promise.resolve():loadScript(PDFJS+'pdf.min.js');
  return load.then(function(){
    window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';
    return window.pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  }).then(function(pdf){
    var lines=[];
    function page(n){
      if(n>pdf.numPages)return Promise.resolve();
      return pdf.getPage(n).then(function(pg){return pg.getTextContent()}).then(function(tc){
        var line='',lastY=null;
        tc.items.forEach(function(it){
          if(typeof it.str!=='string')return;
          var y=it.transform?it.transform[5]:0;
          if(line&&lastY!==null&&Math.abs(y-lastY)>3){lines.push(line);line=''}
          line+=it.str;lastY=y;
          if(it.hasEOL){lines.push(line);line='';lastY=null}
        });
        if(line)lines.push(line);
        return page(n+1);
      });
    }
    return page(1).then(function(){return pdf.getMetadata().then(function(m){return (m&&m.info&&m.info.Title)||''}).catch(function(){return ''})})
      .then(function(title){return {title:title,author:'',blocks:pdfBlocks(lines)}});
  });
}

/* rtf */
function rtfToText(s){
  var cp=(s.match(/\\ansicpg(\d+)/)||[0,'1252'])[1],dec;
  try{dec=new TextDecoder('windows-'+cp)}catch(e){dec=new TextDecoder('windows-1252')}
  var out='',pend=[],i=0,depth=0,skipAt=-1,uc=1,ucs=[];
  var SKIP={fonttbl:1,colortbl:1,stylesheet:1,info:1,pict:1,header:1,footer:1,footnote:1,object:1,themedata:1,colorschememapping:1,latentstyles:1,datastore:1,listtable:1,listoverridetable:1,rsidtbl:1,generator:1,fldinst:1,xmlnstbl:1,filetbl:1};
  function fl(){if(pend.length){if(skipAt<0)out+=dec.decode(new Uint8Array(pend));pend=[]}}
  while(i<s.length){
    var c=s[i];
    if(c==='{'){fl();depth++;ucs.push(uc);i++;if(s[i]==='\\'&&s[i+1]==='*'&&skipAt<0)skipAt=depth;continue}
    if(c==='}'){fl();if(skipAt===depth)skipAt=-1;depth--;uc=ucs.pop();if(uc===undefined)uc=1;i++;continue}
    if(c==='\\'){
      var n=s[i+1];
      if(n==="'"){pend.push(parseInt(s.substr(i+2,2),16)||0);i+=4;continue}
      fl();
      if(n==='\\'||n==='{'||n==='}'){if(skipAt<0)out+=n;i+=2;continue}
      if(n==='~'){if(skipAt<0)out+=' ';i+=2;continue}
      var m=/^\\([a-zA-Z]+)(-?\d+)? ?/.exec(s.slice(i,i+40));
      if(!m){i+=2;continue}
      i+=m[0].length;
      var w=m[1],v=m[2]===undefined?null:parseInt(m[2],10);
      if(SKIP[w]&&skipAt<0){skipAt=depth;continue}
      if(skipAt>=0)continue;
      if(w==='par'||w==='line'||w==='sect'||w==='page')out+='\n';
      else if(w==='tab')out+=' ';
      else if(w==='uc'&&v!==null)uc=v;
      else if(w==='u'&&v!==null){
        out+=String.fromCharCode(v<0?v+65536:v);
        for(var k=0;k<uc;k++){if(s[i]==='\\'&&s[i+1]==="'")i+=4;else if(s[i]&&s[i]!=='\\'&&s[i]!=='{'&&s[i]!=='}')i++}
      }
      continue;
    }
    if(c==='\r'||c==='\n'){i++;continue}
    fl();if(skipAt<0)out+=c;i++;
  }
  fl();return out;
}

/* ghép khối thành chương */
function blocksToChapters(blocks){
  var chs=[],cur=null;
  blocks.forEach(function(b){
    if(b.h){if(cur&&cur.p.length)chs.push(cur);cur={t:b.t,p:[]}}
    else{if(!cur)cur={t:null,p:[]};cur.p.push(b.t)}
  });
  if(cur&&cur.p.length)chs.push(cur);
  return chs.map(function(c,i){return {t:c.t||(chs.length===1?'Trọn truyện':i===0?'Mở đầu':'Chương '+(i+1)),p:c.p}});
}
function splitLong(chs){
  if(chs.length!==1||chs[0].p.length<=400)return chs;
  var p=chs[0].p,out=[];
  for(var i=0;i<p.length;i+=200)out.push({t:'Phần '+(out.length+1),p:p.slice(i,i+200)});
  return out;
}

/* nhận một file, trả về {library:[...]} hoặc {title,author,chapters} */
function parseFile(file){
  if(file.size>60*1024*1024)return Promise.reject(new Error('File quá lớn (trên 60 MB)'));
  return file.arrayBuffer().then(function(buf){
    var u=new Uint8Array(buf),name=file.name||'truyen',ext=((name.match(/\.([^.]+)$/)||[])[1]||'').toLowerCase(),base=name.replace(/\.[^.]+$/,'');
    var isZip=u[0]===0x50&&u[1]===0x4B,isPdf=u[0]===0x25&&u[1]===0x50&&u[2]===0x44&&u[3]===0x46,res;
    if(isPdf)res=parsePdf(buf);
    else if(isZip){
      var z=zipRead(buf);
      res=z.names.indexOf('word/document.xml')>-1?parseDocx(z):z.names.indexOf('META-INF/container.xml')>-1?parseEpub(z):z.names.indexOf('content.xml')>-1?parseOdt(z):Promise.reject(new Error('Kiểu file nén này chưa hỗ trợ'));
    }
    else if(ext==='doc'||(u[0]===0xD0&&u[1]===0xCF&&u[2]===0x11&&u[3]===0xE0))res=Promise.reject(new Error('File .doc (Word cũ) chưa đọc được. Hãy mở bằng Word rồi Lưu thành .docx hoặc .txt'));
    else{
      var text=decodeText(buf);
      if(text.indexOf('\u0000')>-1)return Promise.reject(new Error('Đây không phải file văn bản'));
      if(text.slice(0,5)==='{\\rtf')res=Promise.resolve({blocks:textBlocks(rtfToText(text))});
      else if(ext==='json'){
        var data;try{data=JSON.parse(text)}catch(e){return Promise.reject(new Error('File .json không đúng định dạng'))}
        if(data&&!Array.isArray(data)&&Array.isArray(data.stories))data=data.stories;
        if(data&&!Array.isArray(data))data=[data];
        var lib=clean(data);
        if(!lib.length)return Promise.reject(new Error('File .json không có truyện hợp lệ'));
        return {library:lib};
      }
      else if(/^(html?|xhtml)$/.test(ext)||/^\s*(<!doctype html|<html)/i.test(text)){
        var doc=new DOMParser().parseFromString(text,'text/html'),ti=doc.querySelector('title');
        res=Promise.resolve({title:ti?ti.textContent.trim():'',blocks:htmlBlocks(doc)});
      }
      else res=Promise.resolve({blocks:textBlocks(text,/^(md|markdown)$/.test(ext))});
    }
    return res.then(function(r){
      var chs=r.chapters||splitLong(blocksToChapters(r.blocks||[]));
      if(!chs.length)throw new Error('Không tìm thấy chữ trong file (PDF dạng ảnh scan cần chuyển sang chữ trước)');
      return {title:nfc(r.title||base).trim()||base,author:nfc(r.author||'').trim(),chapters:chs};
    });
  });
}

/* ===== GIAO DIỆN ===== */
function ls(k){try{var r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){return null}}
function note(t,keep){var el=document.getElementById('vcUpToast');
  if(!el){el=document.createElement('div');el.id='vcUpToast';el.style.cssText='position:fixed;left:50%;bottom:76px;transform:translateX(-50%);max-width:90vw;background:#1f2a26;color:#fff;padding:10px 16px;border-radius:10px;font:14px/1.4 system-ui,sans-serif;z-index:99999;box-shadow:0 4px 16px rgba(0,0,0,.3)';document.body.appendChild(el)}
  el.textContent=t;el.style.display='block';clearTimeout(note.t);if(!keep)note.t=setTimeout(function(){el.style.display='none'},Math.max(3000,Math.min(10000,t.length*70)))}
function seed(){
  var cur=ls('vc_stories');if(Array.isArray(cur))return Promise.resolve(clean(cur));
  return fetch('truyen.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():[]}).then(function(d){return clean(Array.isArray(d)?d:(d&&d.stories)||[])},function(){return []});
}
function handle(files){
  files=Array.prototype.slice.call(files||[]);if(!files.length)return;
  var out=[],errs=[];
  files.reduce(function(pr,f){return pr.then(function(){
    note('Đang đọc: '+f.name+'…',true);
    return parseFile(f).then(function(r){out.push(r)},function(e){errs.push(f.name+': '+((e&&e.message)||'lỗi'))});
  })},Promise.resolve()).then(seed).then(function(list){
    var added=0;
    out.forEach(function(r,i){
      if(r.library){r.library.forEach(function(s){var k=-1;list.forEach(function(x,j){if(x.id===s.id)k=j});if(k>-1)list[k]=s;else list.push(s);added++})}
      else{list.push({id:uid()+i,sec:r.chapters.length>1?'dai':'ngan',title:r.title,author:r.author,hue:Math.floor(Math.random()*360),tags:[],intro:'',created:Date.now()+i,ch:r.chapters});added++}
    });
    if(added){
      try{localStorage.setItem('vc_stories',JSON.stringify(list))}catch(e){errs.push('Bộ nhớ trình duyệt đầy, không lưu được');added=0}
    }
    if(added){note('Đã nhập '+added+' truyện'+(errs.length?' · '+errs.join(' · '):'')+'. Đang tải lại trang…');setTimeout(function(){location.reload()},1800)}
    else note(errs.join(' · ')||'Không nhập được truyện nào');
  });
}
var inp=document.createElement('input');inp.type='file';inp.multiple=true;
inp.accept='.txt,.md,.markdown,.html,.htm,.docx,.odt,.epub,.rtf,.json,.pdf,text/*';inp.style.display='none';
inp.addEventListener('change',function(){handle(inp.files);inp.value=''});
var btn=document.createElement('button');btn.type='button';btn.textContent='⬆ Up file truyện';
btn.style.cssText='position:fixed;right:16px;bottom:16px;z-index:99998;padding:11px 16px;border:0;border-radius:999px;background:#1D6B58;color:#fff;font:600 14px system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer';
btn.addEventListener('click',function(){inp.click()});
document.body.appendChild(inp);document.body.appendChild(btn);
document.addEventListener('dragover',function(e){if(e.dataTransfer&&Array.prototype.indexOf.call(e.dataTransfer.types||[],'Files')>-1)e.preventDefault()});
document.addEventListener('drop',function(e){if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length){e.preventDefault();handle(e.dataTransfer.files)}});
})();
</script>

<script>
(function(){
  // MÃ BĂM SHA-256 CỦA MẬT KHẨU "vuonchu2026"
  // Dù ai bấm F12 cũng chỉ thấy dải này, không thể dịch ngược ra chữ "vuonchu2026"
  var HASH_KEY = "efdf86beec71d2b826b5bc93c0bc5e8a5b9911e35a9bd084b63e5b3f115e5132"; 

  var gate = document.getElementById('gatekeeper');
  var keyInp = document.getElementById('gateKey');
  var btn = document.getElementById('gateBtn');
  var err = document.getElementById('gateErr');

  if(localStorage.getItem('vc_unlocked') === 'true') {
    gate.style.display = 'none'; 
  } else {
    document.body.style.overflow = 'hidden';
  }

  // Hàm chuyển mật khẩu nhập vào thành mã băm SHA-256 bằng Web Crypto API
  async function sha256(str) {
    var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2, '0'); }).join('');
  }

  async function checkKey() {
    var userHash = await sha256(keyInp.value.trim());
    if(userHash === HASH_KEY) {
      localStorage.setItem('vc_unlocked', 'true');
      gate.style.display = 'none';
      document.body.style.overflow = '';
    } else {
      err.textContent = 'Mã truy cập không đúng!';
      keyInp.value = '';
      keyInp.focus();
    }
  }

  btn.addEventListener('click', checkKey);
  keyInp.addEventListener('keyup', function(e) {
    if(e.key === 'Enter') checkKey();
  });

  // CHẶN CHUỘT PHẢI VÀ TỔ HỢP PHÍM SOI CODE (F12, Ctrl+Shift+I, Ctrl+U)
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'F12' || 
      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
      (e.ctrlKey && (e.key === 'U' || e.key === 'u'))) {
      e.preventDefault();
    }
  });
})();
</script>
